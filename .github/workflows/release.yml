name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: stable (latest, tagged, listed) or canary (silent publish)"
        type: choice
        default: stable
        options: [stable, canary]
      version:
        description: Exact version. Plain semver for stable (for example 0.1.1); a -canary.* version or empty for an automatic canary version.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.channel }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert the npm read credential survived
        shell: bash
        run: |
          LINE='//registry.npmjs.org/:_authToken=${NPM_TOKEN}'
          if ! grep -qxF "$LINE" .npmrc; then
            echo "::error file=.npmrc::.npmrc is missing the line $LINE" >&2
            echo "Publishing itself does not need it: npm authenticates through GitHub OIDC trusted publishing." >&2
            echo "That line is the READ credential for the restricted @extension.dev packages, which this install and every generated customer repo resolve from the registry." >&2
            echo "'npm logout' deletes it silently. Restore the line and push before releasing." >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate version
        id: validate
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo "$RAW_VERSION" | xargs)"
          if [ "$CHANNEL" = "canary" ]; then
            if [ -z "$VERSION" ]; then
              BASE="$(node -p "require('./package.json').version.split('-')[0]")"
              VERSION="${BASE}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9A-Za-z.-]+$ ]]; then
              echo "The canary channel takes a -canary.* version, for example 0.1.1-canary.1, or an empty version for an automatic one" >&2
              exit 1
            fi
            {
              echo "version=$VERSION"
              echo "dist_tag=canary"
            } >> "$GITHUB_OUTPUT"
            echo "Canary $VERSION publishes under the canary tag: no commit, tag, GitHub release or MCP registry listing"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be plain semver, for example 0.1.1" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally" >&2
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "dist_tag=latest"
          } >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: inputs.channel == 'stable'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '/^## /{p=($2==ver); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > "$NOTES_FILE"
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "CHANGELOG.md has no '## $VERSION' section. Write the changelog entry and push it before releasing." >&2
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "publish_access=$(node -p 'require("./package.json").publishConfig?.access || "public"')" >> "$GITHUB_OUTPUT"

      # npm view answers E404 for a version that is not on the registry and
      # anything else (network, auth, a 5xx) for a read that did not happen;
      # only the first means "not published yet". A version that IS published
      # while its tag is absent is the stranded shape a failed push leaves
      # behind, and the rerun finishes the tag instead of refusing.
      - name: Check published version
        id: published
        shell: bash
        run: |
          PKG="${{ steps.meta.outputs.name }}"
          VER="${{ steps.validate.outputs.version }}"
          set +e
          OUT="$(npm view "$PKG@$VER" version --registry https://registry.npmjs.org/ 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$PKG@$VER is already on npm and its tag is absent: the publish went through on an earlier run and the push did not; this run tags and releases it without publishing again"
            echo "already=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q "E404"; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not read the registry for $PKG@$VER (exit $STATUS): $OUT" >&2
            exit 1
          fi

      # The version bump must precede the build: rslib inlines package.json
      # into dist, and publish runs with --ignore-scripts, so a post-build
      # bump ships a server that reports the previous release's version.
      - name: Update package version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          node -e "
            const fs = require('fs');
            const v = process.env.VERSION;
            const write = (p, mutate) => {
              if (!fs.existsSync(p)) return;
              const j = JSON.parse(fs.readFileSync(p, 'utf8'));
              mutate(j);
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            };
            write('package.json', (j) => { j.version = v; });
            write('server.json', (j) => {
              j.version = v;
              for (const pkg of j.packages || []) pkg.version = v;
            });
            write('.claude-plugin/plugin.json', (j) => { j.version = v; });
            write('.claude-plugin/marketplace.json', (j) => {
              for (const p of j.plugins || []) p.version = v;
            });
          "

      # docs/tools.json and docs/clients.json carry the package version and
      # the suite asserts the files on disk are the current rendering, so the
      # bump above has to be rendered into them before the suite runs or the
      # release fails on its own version (10.11.0, 2026-10-08).
      - name: Render the docs json for the release version
        run: pnpm docs:tools

      - name: Build
        run: pnpm compile

      - name: Test
        run: pnpm test

      # A substring grep over the bundle greenwashes: the package pins other
      # tools at fixed versions, so any of those matching $VERSION would pass
      # the gate over a stale dist. The bundle exports the manifest version it
      # inlined at build time; ask it directly.
      - name: Assert the built server reports the release version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          BUILT="$(node -e 'import("./dist/module.js").then((m) => process.stdout.write(String(m.version)))')"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "dist/module.js reports version ${BUILT:-<none>}, not $VERSION; the bundle was built from a stale tree" >&2
            exit 1
          fi

      - name: Assert the type declarations were emitted
        run: test -f dist/module.d.ts

      - name: Configure git identity
        if: inputs.channel == 'stable'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The main ruleset requires four checks on every push and lists deploy
      # keys as its bypass actor, so the release bump rides the repo-scoped
      # deploy key instead of the runner token. Decided 2026-08-03
      # after run 30851316349 was rejected mid-release.
      - name: Authenticate the release push as the deploy key
        if: inputs.channel == 'stable'
        env:
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
        run: |
          if [ -z "$RELEASE_PUSH_KEY" ]; then
            echo "RELEASE_PUSH_KEY is unset; the bump push would be rejected by the main ruleset" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_PUSH_KEY" > ~/.ssh/release_push_key
          chmod 600 ~/.ssh/release_push_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${{ github.repository }}.git"
          git config core.sshCommand "ssh -i ~/.ssh/release_push_key -o IdentitiesOnly=yes"

      - name: Prepare npm README
        run: node scripts/readme-logo-width.mjs npm

      # OIDC trusted publishing needs npm >= 11.5.1; pin the newest npm so we
      # never depend on which patch of npm the Node runtime happens to ship.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      # No NODE_AUTH_TOKEN: npm authenticates via the GitHub OIDC token
      # (id-token: write above) against the trusted publisher configured on
      # npmjs.com for this repo/workflow. Provenance is generated automatically.
      - name: Publish to npm with provenance
        id: publish
        if: steps.published.outputs.already != 'true'
        run: npm publish --provenance --access ${{ steps.meta.outputs.publish_access }} --tag ${{ steps.validate.outputs.dist_tag }} --ignore-scripts

      # extensiondev/mcp was recreated on 2026-10-11, after GitHub started giving
      # new repositories an immutable OIDC subject, and npm trusted publishing
      # does not match that subject yet (npm/cli#9969). Until it does, the
      # exchange answers "package not found" and the publish ends in E404.
      - name: Explain a refused trusted publish
        if: failure() && steps.publish.outcome == 'failure'
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.validate.outputs.version }}
          DIST_TAG: ${{ steps.validate.outputs.dist_tag }}
        run: |
          NEXT="nothing else is needed for a canary"
          if [ "$CHANNEL" = "stable" ]; then
            NEXT="then run this workflow again with the same inputs: it sees the version on npm, skips the publish, and commits, tags, releases and lists it"
          fi
          echo "::error::npm refused the trusted publish. While npm/cli#9969 is open, publish $VERSION from a machine (npm stage publish with --provenance=false --tag $DIST_TAG, then npm stage approve with a one-time code); $NEXT."

      # The tag and the bump are pushed only once npm serves the tarball: a
      # publish that fails after the push left vX.Y.Z tagged and main bumped
      # while npm served nothing, and the rerun was refused by the tag check.
      - name: Commit and tag release
        if: inputs.channel == 'stable'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          git add package.json pnpm-lock.yaml server.json .claude-plugin docs/tools.json docs/clients.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
          fi
          git tag -a "$TAG" --cleanup=whitespace -F "${{ steps.notes.outputs.file }}"
          git push
          git push origin "$TAG"

      - name: Create GitHub release
        if: inputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "${{ steps.notes.outputs.file }}"

      # The MCP registry entry is a third surface this release moves, alongside
      # npm and the plugin marketplace, and it is the one an agent reads before
      # it installs anything. It sat at 5.1.2 announcing "31 tools, 11 browsers"
      # for twelve days after 10.3.0 shipped, because publishing it had never
      # been anything but a hand step somebody had to remember. It runs here, in
      # the same job that published the tarball it describes.
      #
      # A tag-triggered workflow would not do: this job pushes the tag with the
      # default GITHUB_TOKEN, and GitHub does not fire workflows on refs pushed
      # by that token, so the publish would silently never run.
      #
      # login github-oidc needs no secret. The registry grants
      # io.github.<owner>/* off the OIDC token's repository_owner claim, and
      # this repository is owned by extensiondev.
      - name: Publish the listing to the MCP registry
        if: inputs.channel == 'stable'
        run: ./scripts/publish-mcp-registry.sh
