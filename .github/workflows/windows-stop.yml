name: Windows stop

# CI runs on Ubuntu only, so the win32 branch of extension_stop had only ever run with the platform faked. This workflow is
# dispatched by hand to run the real-tree cell on a Windows host. The cell is
# skipped everywhere else, so the last step fails the run unless it actually
# executed and passed here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stop:
    runs-on: windows-latest
    name: stop on windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run the stop cells
        shell: bash
        run: |
          pnpm exec vitest run src/__tests__/stop-windows.test.ts src/__tests__/stop.test.ts src/__tests__/lifecycle-wave6.test.ts --reporter=verbose --reporter=json --outputFile.json=stop-cells.json

      - name: Require the real-tree cell to have run
        shell: bash
        run: |
          node -e '
            const r = require("./stop-cells.json");
            const cells = r.testResults.flatMap((f) => f.assertionResults);
            const cell = cells.find((c) => c.title.includes("ends the session'"'"'s whole process tree"));
            console.log(cell ? `${cell.status}: ${cell.fullName}` : "the real-tree cell is missing");
            process.exit(cell && cell.status === "passed" ? 0 : 1);
          ' 
