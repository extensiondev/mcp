name: Sync template catalog

# The catalog snapshot used to land through a pull request opened with the
# runner token, and a pull request opened that way gets no CI run, so the
# snapshot sat unchecked for a week (PR #7). The job now runs the suite on the
# new snapshot itself and pushes to main when it is green, over the deploy key
# the main ruleset lists as its bypass actor, the way the release lane does.
# The push still triggers the CI matrix on main. Decided 2026-10-08.
#
# The snapshot is read at the commit PINNED_COMMIT names in
# src/lib/template-artifact-source.ts, never from the floating nightly
# release: the bundled fallback has to describe the same corpus the resolver
# pins, and on 2026-10-19 the nightly snapshot sat at ba1bab33 while the pin
# was 8e23368. Moving the pin is the only way to move this file.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read the pinned examples commit
        id: pin
        run: |
          PIN="$(sed -n 's/^export const PINNED_COMMIT = "\([0-9a-f]\{40\}\)";$/\1/p' src/lib/template-artifact-source.ts)"
          if [ -z "$PIN" ]; then
            echo "PINNED_COMMIT was not found in src/lib/template-artifact-source.ts" >&2
            exit 1
          fi
          echo "commit=$PIN" >> "$GITHUB_OUTPUT"
          echo "Pinned examples commit: $PIN"

      - name: Fetch templates-meta.json at the pinned commit
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/extension-js/examples/${{ steps.pin.outputs.commit }}/templates-meta.json" \
            -o /tmp/templates-meta-latest.json

      - name: Check for changes
        id: diff
        run: |
          CACHED="src/lib/templates-meta.snapshot.json"
          if [ ! -f "$CACHED" ]; then
            echo "No snapshot exists yet, one will be created."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! diff -q /tmp/templates-meta-latest.json "$CACHED" > /dev/null 2>&1; then
            echo "Template catalog has changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Template catalog is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update snapshot
        if: steps.diff.outputs.changed == 'true'
        run: cp /tmp/templates-meta-latest.json src/lib/templates-meta.snapshot.json

      - name: Summarise the catalog
        if: steps.diff.outputs.changed == 'true'
        run: |
          node -e "
            const meta = require('/tmp/templates-meta-latest.json');
            const templates = meta.templates || [];
            console.log('Pinned commit: ${{ steps.pin.outputs.commit }} (catalog says ' + meta.commit + ', generated ' + meta.generatedAt + ')');
            console.log('Total templates: ' + templates.length);
            console.log('Featured: ' + templates.filter(t => t.featured).length);
            console.log('Surfaces: ' + [...new Set(templates.flatMap(t => t.surfaces || []))].sort().join(', '));
          "

      - name: Setup pnpm
        if: steps.diff.outputs.changed == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 10.19.0

      - name: Setup Node.js
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: pnpm compile

      - name: Typecheck (src and tests)
        if: steps.diff.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.diff.outputs.changed == 'true'
        run: pnpm lint

      - name: Test on the new snapshot
        if: steps.diff.outputs.changed == 'true'
        run: pnpm test

      - name: Configure git identity
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Authenticate the push as the deploy key
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
        run: |
          if [ -z "$RELEASE_PUSH_KEY" ]; then
            echo "RELEASE_PUSH_KEY is unset; the catalog push would be rejected by the main ruleset" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_PUSH_KEY" > ~/.ssh/release_push_key
          chmod 600 ~/.ssh/release_push_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${{ github.repository }}.git"
          git config core.sshCommand "ssh -i ~/.ssh/release_push_key -o IdentitiesOnly=yes"

      - name: Commit and push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git add src/lib/templates-meta.snapshot.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Sync the template catalog to the pinned examples commit"
          git push origin HEAD:main
