name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel: stable (latest, tagged, listed) or canary (silent publish)"
        type: choice
        default: stable
        options: [stable, canary]
      version:
        description: Exact version. Plain semver for stable (for example 0.1.1); a -canary.* version or empty for an automatic canary version.
        required: false
        type: string
      release_commit:
        description: Only for a stable rerun after a version was staged and approved by hand. The commit its tarball was built from, as scripts/stage-release.sh printed it; empty reads the gitHead npm recorded.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.channel }}-${{ inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate version
        id: validate
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(echo "$RAW_VERSION" | xargs)"
          if [ "$CHANNEL" = "canary" ]; then
            if [ -z "$VERSION" ]; then
              BASE="$(node -p "require('./package.json').version.split('-')[0]")"
              VERSION="${BASE}-canary.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"
            fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-canary\.[0-9A-Za-z.-]+$ ]]; then
              echo "The canary channel takes a -canary.* version, for example 0.1.1-canary.1, or an empty version for an automatic one" >&2
              exit 1
            fi
            {
              echo "version=$VERSION"
              echo "dist_tag=canary"
            } >> "$GITHUB_OUTPUT"
            echo "Canary $VERSION publishes under the canary tag: no commit, tag, GitHub release or MCP registry listing"
            exit 0
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be plain semver, for example 0.1.1" >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally" >&2
            exit 1
          fi
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "dist_tag=latest"
          } >> "$GITHUB_OUTPUT"

      - name: Read package metadata
        id: meta
        shell: bash
        run: |
          echo "name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"
          echo "publish_access=$(node -p 'require("./package.json").publishConfig?.access || "public"')" >> "$GITHUB_OUTPUT"

      # npm view answers E404 for a version that is not on the registry and
      # anything else (network, auth, a 5xx) for a read that did not happen;
      # only the first means "not published yet". A version that IS published
      # while its tag is absent is the stranded shape a failed push leaves
      # behind, and the rerun finishes the tag instead of refusing.
      - name: Check published version
        id: published
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          PKG="${{ steps.meta.outputs.name }}"
          VER="${{ steps.validate.outputs.version }}"
          set +e
          OUT="$(npm view "$PKG@$VER" version --registry https://registry.npmjs.org/ 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$PKG@$VER is already on npm and its tag is absent: the publish went through on an earlier run and the push did not; this run tags and releases it without publishing again"
            echo "already=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q "E404"; then
            if [ -n "$(echo "$RELEASE_COMMIT" | xargs)" ]; then
              echo "release_commit is only for a rerun after $PKG@$VER was staged and approved by hand, and npm does not have $VER; run again without it to publish from main" >&2
              exit 1
            fi
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not read the registry for $PKG@$VER (exit $STATUS): $OUT" >&2
            exit 1
          fi

      - name: Check out the commit npm published
        if: inputs.channel == 'stable' && steps.published.outputs.already == 'true'
        id: source
        shell: bash
        env:
          PKG: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          ./scripts/release-commit.sh
          git checkout --detach "$(sed -n 's/^commit=//p' "$GITHUB_OUTPUT" | tail -n 1)"

      - name: Extract release notes from CHANGELOG.md
        if: inputs.channel == 'stable'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VERSION" '/^## /{p=($2==ver); next} p' CHANGELOG.md \
            | sed -e '/./,$!d' > "$NOTES_FILE"
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "CHANGELOG.md has no '## $VERSION' section. Write the changelog entry and push it before releasing." >&2
            exit 1
          fi
          echo "Release notes for $VERSION:"
          cat "$NOTES_FILE"
          echo "file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # The version bump must precede the build: rslib inlines package.json
      # into dist, and publish runs with --ignore-scripts, so a post-build
      # bump ships a server that reports the previous release's version.
      - name: Update package version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: node scripts/set-release-version.mjs "$VERSION"

      # docs/tools.json and docs/clients.json carry the package version and
      # the suite asserts the files on disk are the current rendering, so the
      # bump above has to be rendered into them before the suite runs or the
      # release fails on its own version (10.11.0, 2026-10-08).
      - name: Render the docs json for the release version
        run: pnpm docs:tools

      - name: Build
        run: pnpm compile

      - name: Test
        run: pnpm test

      # A substring grep over the bundle greenwashes: the package pins other
      # tools at fixed versions, so any of those matching $VERSION would pass
      # the gate over a stale dist. The bundle exports the manifest version it
      # inlined at build time; ask it directly.
      - name: Assert the built server reports the release version
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          BUILT="$(node -e 'import("./dist/module.js").then((m) => process.stdout.write(String(m.version)))')"
          if [ "$BUILT" != "$VERSION" ]; then
            echo "dist/module.js reports version ${BUILT:-<none>}, not $VERSION; the bundle was built from a stale tree" >&2
            exit 1
          fi

      - name: Assert the type declarations were emitted
        run: test -f dist/module.d.ts

      - name: Configure git identity
        if: inputs.channel == 'stable'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # The main ruleset requires four checks on every push and lists deploy
      # keys as its bypass actor, so the release bump rides the repo-scoped
      # deploy key instead of the runner token. Decided 2026-08-03
      # after run 30851316349 was rejected mid-release.
      - name: Authenticate the release push as the deploy key
        if: inputs.channel == 'stable'
        env:
          RELEASE_PUSH_KEY: ${{ secrets.RELEASE_PUSH_KEY }}
        run: |
          if [ -z "$RELEASE_PUSH_KEY" ]; then
            echo "RELEASE_PUSH_KEY is unset; the bump push would be rejected by the main ruleset" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELEASE_PUSH_KEY" > ~/.ssh/release_push_key
          chmod 600 ~/.ssh/release_push_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote set-url --push origin "git@github.com:${{ github.repository }}.git"
          git config core.sshCommand "ssh -i ~/.ssh/release_push_key -o IdentitiesOnly=yes"

      - name: Upgrade npm for staging
        run: npm install -g npm@latest

      # npm trusted publishing refuses this repository's OIDC subject
      # (npm/cli#9969), so the run stages the tarball with a stage-only token
      # and a maintainer approves it with a one-time code. The provenance
      # bundle is signed by the OIDC token (id-token: write above), which
      # staging accepts. The token cannot publish by itself.
      - name: Stage on npm with provenance
        id: stage
        if: steps.published.outputs.already != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is unset; staging needs the stage-only npm token for this package" >&2
            exit 1
          fi
          npm pkg set "gitHead=$(git rev-parse HEAD)"
          npm stage publish --provenance --access ${{ steps.meta.outputs.publish_access }} --tag ${{ steps.validate.outputs.dist_tag }} --ignore-scripts 2>&1 | tee "$RUNNER_TEMP/stage.log"
          STAGE_ID="$(sed -n 's/.*staged with id \([0-9a-f-]*\)).*/\1/p' "$RUNNER_TEMP/stage.log" | tail -n 1)"
          echo "stage_id=$STAGE_ID" >> "$GITHUB_OUTPUT"

      # The tag and the bump are pushed only once npm serves the tarball, on
      # the run that follows the approval: a push before npm served anything
      # left vX.Y.Z tagged and main bumped, and the rerun was refused by the
      # tag check.
      - name: Commit and tag release
        id: tag
        if: inputs.channel == 'stable' && steps.published.outputs.already == 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
          MAIN_MOVED: ${{ steps.source.outputs.main_moved }}
        run: |
          git add package.json pnpm-lock.yaml server.json docs/tools.json docs/clients.json docs/store-md-fields.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v$VERSION"
          fi
          git tag -a "$TAG" --cleanup=whitespace -F "${{ steps.notes.outputs.file }}"
          if [ "$MAIN_MOVED" = "true" ]; then
            git push origin "$TAG"
            git fetch origin main
            git checkout --detach origin/main
            node scripts/set-release-version.mjs "$VERSION"
            git add package.json server.json docs/tools.json docs/clients.json docs/store-md-fields.json
            if ! git diff --cached --quiet; then
              git commit -m "Release v$VERSION"
            fi
            git push origin HEAD:refs/heads/main
            echo "main moved past the published commit: $TAG is cut there, and main's own Release v$VERSION commit carries the version bump" >> "$GITHUB_STEP_SUMMARY"
          else
            git push origin HEAD:refs/heads/main
            git push origin "$TAG"
          fi

      - name: Create GitHub release
        if: inputs.channel == 'stable' && steps.tag.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.validate.outputs.version }}
          TAG: ${{ steps.validate.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file "${{ steps.notes.outputs.file }}"

      # The MCP registry entry is a third surface this release moves, alongside
      # npm, and it is the one an agent reads before
      # it installs anything. It sat at 5.1.2 announcing "31 tools, 11 browsers"
      # for twelve days after 10.3.0 shipped, because publishing it had never
      # been anything but a hand step somebody had to remember. It runs here, in
      # the same job that published the tarball it describes.
      #
      # A tag-triggered workflow would not do: this job pushes the tag with the
      # default GITHUB_TOKEN, and GitHub does not fire workflows on refs pushed
      # by that token, so the publish would silently never run.
      #
      # login github-oidc needs no secret. The registry grants
      # io.github.<owner>/* off the OIDC token's repository_owner claim, and
      # this repository is owned by extensiondev.
      - name: Publish the listing to the MCP registry
        if: inputs.channel == 'stable' && steps.tag.outcome == 'success'
        run: ./scripts/publish-mcp-registry.sh

      - name: Report the npm staging
        if: ${{ !cancelled() && (steps.stage.outcome == 'success' || steps.stage.outcome == 'failure') }}
        shell: bash
        env:
          PKG: ${{ steps.meta.outputs.name }}
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ steps.validate.outputs.version }}
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
          STAGE_OUTCOME: ${{ steps.stage.outcome }}
        run: |
          BUILT_FROM="$(git rev-parse HEAD)"
          if [ "$STAGE_OUTCOME" = "success" ]; then
            {
              echo "### $PKG@$VERSION is staged on npm with provenance"
              echo
              echo "Nothing is published yet. Approve it from a machine signed in to npm; it asks for a one-time code."
              echo
              echo '```sh'
              echo "npm stage approve ${STAGE_ID:-<stage-id>}"
              if [ "$CHANNEL" = "stable" ]; then
                echo "gh workflow run release.yml -R ${{ github.repository }} -f channel=stable -f version=$VERSION"
              fi
              echo '```'
              echo
              if [ "$CHANNEL" = "stable" ]; then
                echo "The second run sees $VERSION on npm, skips the staging, and commits, tags, releases and lists $BUILT_FROM, the commit this run built from. Do not bump, tag or push the release by hand."
              else
                echo "A canary needs nothing after the approval."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### npm staging failed"
            echo
            echo "Nothing was staged, committed, tagged, released or listed. Read the Stage on npm with provenance step, fix the cause (an expired NPM_TOKEN is the usual one) and run the workflow again. To stage $VERSION from a machine instead, without provenance:"
            echo
            echo '```sh'
            echo "git fetch origin && git checkout $BUILT_FROM"
            echo "pnpm install --frozen-lockfile"
            echo "scripts/stage-release.sh $VERSION"
            echo "npm stage approve <stage-id>"
            echo "gh workflow run release.yml -R ${{ github.repository }} -f channel=stable -f version=$VERSION -f release_commit=$BUILT_FROM"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::npm did not stage $PKG@$VERSION; the run summary lists what to do"
          exit 1
