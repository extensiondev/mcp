name: CI

# The scheduled run is this repository's deep tier: it is the only event that
# sets RUN_CLI_SMOKE, and it resolves the engine matrix live, so canary can go
# red here for reasons no push ever reproduces. That tier reported to nobody
# until 2026-07-28. It had been red three consecutive nights (07-26, 07-27,
# 07-28) on an assertion the tool's reworded message no longer matched, and
# nothing carried the news out of the Actions tab. A red nightly nobody reads
# is worse than no nightly: it spends the budget and buys the belief that
# something is watched. The nightly-alert job at the bottom is what carries it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  engines:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve engine versions
        id: set
        run: |
          CANARY=$(npm view extension-develop@canary version)
          STABLE=$(npm view extension-develop version)
          FLOOR=$(node -p "require('./package.json').dependencies['extension-develop'].replace(/^[~^]/,'')")
          echo "canary=$CANARY stable=$STABLE floor=$FLOOR"
          node -e '
            const cells = [
              ["canary", process.argv[1]],
              ["stable", process.argv[2]],
              ["floor", process.argv[3]],
            ];
            const seen = new Set();
            const include = [];
            for (const [name, version] of cells) {
              if (seen.has(version)) continue;
              seen.add(version);
              include.push({name, version});
            }
            console.log("matrix=" + JSON.stringify({include}));
          ' "$CANARY" "$STABLE" "$FLOOR" >> "$GITHUB_OUTPUT"

  verify:
    needs: engines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.engines.outputs.matrix) }}
    name: verify (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Pin engine (${{ matrix.name }} = ${{ matrix.version }})
        run: pnpm add "extension-develop@${{ matrix.version }}"

      - name: Build
        run: pnpm compile

      - name: Typecheck (src and tests)
        run: pnpm typecheck

      - name: Test
        env:
          RUN_CLI_SMOKE: ${{ github.event_name == 'schedule' && '1' || '' }}
          EXTENSION_MCP_CLI_VERSION: ${{ matrix.version }}
        run: pnpm test

  # The engine pin is the second surface that goes stale without any commit
  # going wrong. This package spawns whatever `extension-develop` its own
  # dependencies name, so an engine release that nobody mirrors here leaves
  # every agent building on an old engine while a human on `npx extension`
  # builds on the new one. It sat nine releases behind before a C4 walk of the
  # MCP journey caught it (2026-08-04, engine 4.0.20 against npm 4.0.29), and
  # by then two shipped theme-colour fixes were missing from the agent lane
  # entirely. Like the listing check below, this reads npm rather than the
  # working tree, and it runs nightly because the event that invalidates it
  # happens in another repository.
  engine-pin:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: The pinned engine matches what npm serves
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const deps = require("./package.json").dependencies || {};
            const engines = ["extension-create", "extension-develop", "extension-install"];
            const problems = [];
            for (const name of engines) {
              const pinned = String(deps[name] || "").trim();
              if (!pinned) { problems.push(`${name} is not pinned at all`); continue; }
              if (!/^\d+\.\d+\.\d+(-[\w.]+)?$/.test(pinned)) {
                problems.push(`${name} is pinned to "${pinned}", which is a range or a tag, not an exact version`);
                continue;
              }
              const latest = execFileSync("npm", ["view", name, "version", "--registry", "https://registry.npmjs.org/"], { encoding: "utf8" }).trim();
              if (pinned !== latest) {
                problems.push(`${name} is pinned at ${pinned} while npm serves ${latest}`);
              }
            }
            if (problems.length) {
              console.error([
                "The engine this server spawns has drifted from the published engine.",
                ...problems.map((p) => `- ${p}`),
                "",
                "Agents driving this MCP build with the pinned engine, so every fix",
                "released since the pin is missing from the agent lane. Bump the",
                "engine dependencies in package.json and cut a release.",
              ].join("\n"));
              process.exit(1);
            }
            console.log("engine pin matches npm for: " + engines.join(", "));
          '

  # The MCP registry listing is the one surface that can go stale without any
  # commit going wrong: nothing in this repository changes when it drifts. It
  # spent twelve days announcing 5.1.2 and "31 tools, 11 browsers" while npm
  # served 10.3.0 with 28, and the only reason anyone found out was a walk of
  # the docs page that cites it by name. The release lane publishes it now, but
  # a lane that publishes is not a lane that is watched, so this reads the two
  # public surfaces against each other and lets the nightly alert carry the
  # news. It compares the registry to npm rather than to the working tree, so a
  # bumped-but-unreleased version never reds it.
  registry-listing:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: The registry listing matches what npm serves
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          MCP_NAME="$(node -p 'require("./package.json").mcpName')"
          NPM_LATEST="$(npm view "$NAME" version --registry https://registry.npmjs.org/)"
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=$MCP_NAME" > listing.json
          node -e '
            const fs = require("node:fs");
            const [name, npmLatest] = process.argv.slice(1);
            const meta = "io.modelcontextprotocol.registry/official";
            const body = JSON.parse(fs.readFileSync("listing.json", "utf8"));
            const latest = (body.servers || []).find(
              (entry) => entry.server?.name === name && entry._meta?.[meta]?.isLatest,
            );
            if (!latest) {
              console.error(`${name} has no entry flagged isLatest in the registry`);
              process.exit(1);
            }
            const problems = [];
            if (latest.server.version !== npmLatest) {
              problems.push(
                `the registry serves ${latest.server.version} as latest while npm serves ${npmLatest}`,
              );
            }
            const pinned = (latest.server.packages || []).filter((p) => p.version !== npmLatest);
            for (const p of pinned) {
              problems.push(`the listing points install at ${p.identifier}@${p.version}`);
            }
            if (problems.length) {
              console.error(
                [
                  `The MCP registry listing for ${name} has drifted from npm.`,
                  ...problems.map((p) => `- ${p}`),
                  "",
                  "Run the Publish MCP registry listing workflow to republish server.json from main.",
                ].join("\n"),
              );
              process.exit(1);
            }
            console.log(`${name} is listed at ${npmLatest}: ${latest.server.description}`);
          ' "$MCP_NAME" "$NPM_LATEST"

  # Opens one tracking issue when the deep tier fails, comments on it while it
  # stays failing, and closes it on the first clean run. Ported from the
  # monorepo's deep-tier-alert with two changes this repository needs.
  #
  # It reads the run's own job list instead of `needs.verify.result`, because
  # verify is a matrix and the aggregate cannot say WHICH engine broke. Canary
  # and stable fail for different reasons and want different responses, so the
  # alert names the leg.
  #
  # A cancelled run closes nothing. `cancelled` is neither failure nor success,
  # and a run that was killed mid-flight is not evidence that the deep tier is
  # healthy; treating it as green is how an alert learns to lie. It reports the
  # ambiguity and leaves any open issue alone.
  #
  # workflow_dispatch alerts on the same terms as the schedule, deliberately.
  # A dispatch runs the identical matrix, and a separate drill-only switch
  # would mean the path exercised by hand is not the path that runs at 06:00.
  # It is also how this job was proven: dispatched once against a branch with a
  # deliberately broken test to watch the issue open, then once against green
  # main to watch it close.
  nightly-alert:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [engines, verify, registry-listing]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or close the nightly alert
        uses: actions/github-script@v8
        with:
          script: |
            const title = "🚨 the nightly CI is failing";
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: context.runId, per_page: 100 },
            );
            const others = jobs.filter(
              (j) => j.name !== context.job && j.status === "completed",
            );
            const failed = others.filter(
              (j) => j.conclusion === "failure" || j.conclusion === "timed_out",
            );
            const unclear = others.filter(
              (j) => j.conclusion === "cancelled" || j.conclusion === "action_required",
            );
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            const found = open.find((i) => i.title === title);
            if (failed.length === 0 && unclear.length > 0) {
              core.notice(
                `${unclear.length} job(s) did not reach a verdict (${unclear
                  .map((j) => `${j.name}: ${j.conclusion}`)
                  .join(", ")}). A cancelled run is not a green one, so nothing is being closed.`,
              );
              return;
            }
            if (failed.length === 0) {
              if (found) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: found.number,
                  body: `The nightly is green again (${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: found.number, state: "closed",
                });
              }
              return;
            }
            const detail = failed
              .map((j) => `- \`${j.name}\`: **${j.conclusion}** (${j.html_url})`)
              .join("\n");
            if (found) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: found.number,
                body: `Still failing.\n\n${detail}\n\nRun: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                `The ${context.eventName} run of CI did not pass. The scheduled tier is the only one that sets \`RUN_CLI_SMOKE\` and the only one that resolves the engine matrix against whatever npm is publishing today, so nothing on a push reports what breaks here.`,
                ``,
                detail,
                ``,
                `- Run: ${runUrl}`,
                ``,
                `_Filed automatically by the CI nightly alert; it closes itself on the next clean run._`,
              ].join("\n"),
            });
